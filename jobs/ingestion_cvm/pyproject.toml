[project]
name = "cvm-ingestion"
version = "0.1.0"
description = "BCB SGS ingestion connector for the macro domain"
requires-python = ">=3.11"
dependencies = [
    "requests==2.32.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["cvm_ingestion"]
branch = true